<div>
  What unreviewed visual changes do to the Jenkins build: <code>UNSTABLE</code> (default) marks it yellow,
  <code>FAILURE</code> fails it, <code>SUCCESS</code> leaves it alone. Rejected or aborted tests always fail the build.
  <p>Tip: set <code>failTestsOnDiff: false</code> in your Eyes SDK config so the plugin, not the test runner, decides.</p>
</div>
